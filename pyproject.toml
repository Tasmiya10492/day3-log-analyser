
[project]
name = "day3-log-analyser"
version = "0.1.0"
description = "A Python package that analyses log files and generates JSON summaries"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_analyser", "src/apiclient"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/.venv-day4",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.pyright",
    "/dist",
]

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
